<style>
  /* QUATRE HABILLAGES, UN SEUL SITE. Le thème arrive du manifeste, écrit depuis le CRM
     (Réglages → Le site public). Tout ce qui change d'un thème à l'autre est un jeton
     ci-dessous : une couleur, une police, une échelle. Écrire une couleur en dur ailleurs
     dans la feuille, c'est fabriquer un thème qui ne s'applique qu'à moitié.
     `atelier` est le défaut — c'est exactement l'allure d'avant, pour qu'un manifeste
     publié plus tôt ne change pas d'apparence tout seul. */
  :root{
    --ink:#3d3934;
    --stone:#8a8074;
    --stone-light:#b4aa9b;
    --travertine:#e8e2d7;
    --paper:#f4efe6;
    --hair:#d3cabb;
    --oxblood:#9a8574;
    --titre:'Cormorant Garamond',Georgia,serif;
    --texte:'Inter',system-ui,-apple-system,sans-serif;
    --nom-poids:500;
    --nom-taille:22px;
    --nom-espace:0;
    --nom-casse:none;
  }
  /* ÉPURE — blanc pur, aucune couleur, tout repose sur les photos et l'espace. */
  html[data-theme="epure"]{
    --ink:#111111; --stone:#8a8a8a; --stone-light:#b5b5b5;
    --travertine:#eeeeee; --paper:#ffffff; --hair:#e3e3e3; --oxblood:#111111;
    --titre:'Jost',system-ui,sans-serif; --texte:'Jost',system-ui,sans-serif;
    --nom-poids:500; --nom-taille:13px; --nom-espace:.14em; --nom-casse:uppercase;
  }
  /* INDEX — les projets se lisent comme un sommaire, l'image vient en appui. */
  html[data-theme="index"]{
    --ink:#212121; --stone:#8d8d8d; --stone-light:#a8a8a8;
    --travertine:#e8e8e8; --paper:#f4f4f4; --hair:#dcdcdc; --oxblood:#212121;
    --titre:'Cormorant Garamond',Georgia,serif; --texte:'Jost',system-ui,sans-serif;
    --nom-poids:400; --nom-taille:clamp(21px,3.4vw,29px); --nom-espace:.01em; --nom-casse:none;
  }
  /* NUIT — fond très sombre : les intérieurs éclairés ressortent, le texte s'efface. */
  html[data-theme="nuit"]{
    --ink:#e6e2dc; --stone:#948e86; --stone-light:#736d66;
    --travertine:#1d1d1d; --paper:#0f0f0f; --hair:#2a2a2a; --oxblood:#c9b79c;
    --titre:'Jost',system-ui,sans-serif; --texte:'Jost',system-ui,sans-serif;
    --nom-poids:300; --nom-taille:19px; --nom-espace:.06em; --nom-casse:none;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--texte);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  header{
    padding:clamp(38px,9vw,86px) 22px clamp(26px,5vw,44px);
    text-align:center;border-bottom:1px solid var(--hair);
  }
  .name{
    font-family:var(--titre);
    font-weight:500;font-size:clamp(29px,7vw,52px);
    letter-spacing:.16em;text-transform:uppercase;margin:0;line-height:1.1;
  }
  .tagline{
    margin:16px 0 0;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--stone);font-weight:500;
  }

  /* ---- BANDEAU D'ACCUEIL ----
     Une grande image sous le nom du studio, qui fait défiler les projets. Deux photos qui
     se suivent dans un même projet, puis les deux suivantes, projets tirés au hasard.
     Deux couches superposées : on prépare celle qui est cachée, et on ne croise les
     opacités qu'une fois les images CHARGÉES — sinon le fondu révélerait un trou blanc. */
  .bandeau{
    position:relative;width:100%;overflow:hidden;background:var(--travertine);
    height:clamp(210px,44vh,520px);border-bottom:1px solid var(--hair);
    display:block;
  }
  /* Le bouton qui ouvre le projet couvre toute la surface ; les flèches sont ses voisines,
     pas ses enfants — un bouton dans un bouton n'existe pas en HTML, et le lecteur d'écran
     comme le clavier s'y perdent. */
  .bd-ouvrir{
    position:absolute;inset:0;width:100%;height:100%;overflow:hidden;
    display:block;padding:0;border:0;background:none;
    cursor:pointer;font-family:inherit;color:inherit;text-align:left;
  }
  .bd-couche{
    position:absolute;inset:0;display:grid;gap:2px;
    opacity:0;transition:opacity 1.3s ease;
  }
  .bd-couche.on{opacity:1;}
  .bd-couche.duo{grid-template-columns:1fr 1fr;}
  .bd-case{position:relative;overflow:hidden;background:var(--travertine);}
  .bd-case img{
    width:100%;height:100%;object-fit:cover;display:block;
    /* Un lent rapprochement pendant que la photo est à l'écran : le mouvement se sent sans
       se voir. La durée suit le délai réglé (variable posée en JS), pour que le zoom
       finisse quand la photo s'en va, et pas au milieu. */
    transform:scale(1.001);
  }
  .bd-couche.on .bd-case img{transform:scale(1.055);transition:transform var(--bd-duree,7s) linear;}
  /* Le voile ne suit PAS le thème : il est posé sur une photo, pas sur le fond de page.
     C'est la photo qu'il doit rendre lisible, quelle que soit l'allure du site. */
  .bd-voile{
    position:absolute;left:0;right:0;bottom:0;height:38%;pointer-events:none;
    background:linear-gradient(to top,rgba(0,0,0,.46),rgba(0,0,0,0));
  }
  .bd-legende{
    position:absolute;left:clamp(16px,3vw,34px);bottom:clamp(13px,2.6vw,26px);right:clamp(16px,3vw,34px);
    color:#fff;pointer-events:none;
  }
  .bd-nom{
    display:block;font-family:var(--titre);font-size:clamp(17px,2.6vw,27px);
    line-height:1.2;margin:0;text-shadow:0 1px 12px rgba(0,0,0,.45);
  }
  .bd-meta{
    display:block;margin-top:5px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.5);
  }
  .bd-ouvrir:hover .bd-nom,.bd-ouvrir:focus-visible .bd-nom{text-decoration:underline;text-underline-offset:5px;}
  .bd-ouvrir:focus-visible{outline:2px solid var(--oxblood);outline-offset:-3px;}
  /* ---- Défiler à la main ----
     Les flèches sont discrètes sur ordinateur (elles se révèlent au survol) et TOUJOURS
     visibles au doigt : sans survol, une commande invisible n'existe pas. */
  .bd-fleche{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;border:0;padding:0;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;font-size:26px;line-height:1;cursor:pointer;
    /* Assez contrastée pour rester lisible sur une photo claire comme sur une photo
       sombre : une flèche pâle sur un mur blanc n'est pas une commande, c'est une tache. */
    background:rgba(0,0,0,.42);color:#fff;
    box-shadow:0 1px 10px rgba(0,0,0,.28);
    opacity:0;transition:opacity .25s ease,background .2s ease;
  }
  .bd-fleche.prec{left:clamp(8px,1.6vw,18px);}
  .bd-fleche.suiv{right:clamp(8px,1.6vw,18px);}
  .bd-fleche:hover{background:rgba(0,0,0,.55);}
  .bandeau:hover .bd-fleche,.bd-fleche:focus-visible{opacity:1;}
  .bd-fleche:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  /* Pas de survol possible : on les montre en permanence, un peu plus discrètes. */
  @media (hover:none){.bd-fleche{opacity:.82;}}
  /* Un projet ouvert : le bandeau appartient à l'accueil, il n'a rien à faire au-dessus
     d'un projet. */
  body.viewing .bandeau{display:none;}
  /* Le bandeau tient dans une seule case quand une seule photo est demandée. */
  .bd-couche.solo{grid-template-columns:1fr;}
  @media (prefers-reduced-motion:reduce){
    .bd-couche{transition:none;}
    .bd-couche.on .bd-case img{transform:none;transition:none;}
  }

  /* ---- LE MENU DU SITE ----
     Collant en haut : sur un portfolio, on descend loin dans les photos, et remonter pour
     changer de section est le geste qu'on ne fait pas. Il défile latéralement sur
     téléphone plutôt que de se replier derrière un ☰ : trois à cinq entrées se lisent
     d'un coup d'œil, un menu replié les cache pour rien. */
  .menu{
    position:sticky;top:0;z-index:40;
    background:var(--paper);border-bottom:1px solid var(--hair);
  }
  /* Sur téléphone, les entrées débordent et se font défiler du doigt. Un dégradé sur le
     bord dit qu'il y a une suite : sans lui, la dernière entrée coupée ressemble à un
     défaut d'affichage, et personne ne pense à glisser. */
  .menu::after{
    content:"";position:absolute;top:0;right:0;bottom:1px;width:34px;pointer-events:none;
    background:linear-gradient(to right,transparent,var(--paper));
  }
  @media (min-width:760px){.menu::after{display:none;}}
  .menu-in{
    max-width:1240px;margin:0 auto;padding:0 14px;
    display:flex;align-items:stretch;gap:clamp(4px,1.4vw,20px);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .menu-in::-webkit-scrollbar{display:none;}
  .menu-in button{
    flex:0 0 auto;background:none;border:0;padding:14px 6px;cursor:pointer;
    font-family:var(--texte);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    font-weight:600;color:var(--stone);white-space:nowrap;
    border-bottom:2px solid transparent;transition:color .2s ease,border-color .2s ease;
  }
  .menu-in button:hover{color:var(--ink);}
  .menu-in button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--oxblood);}
  .menu-in button:focus-visible{outline:2px solid var(--oxblood);outline-offset:-4px;}

  main{max-width:1240px;margin:0 auto;padding:clamp(30px,6vw,64px) 22px 90px;}

  .eyebrow{
    display:flex;align-items:center;gap:14px;margin:0 0 26px;
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);font-weight:600;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--hair);}

  .projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:clamp(18px,3vw,34px);}
  .project{
    border:none;background:none;padding:0;margin:0;text-align:left;cursor:pointer;
    font-family:inherit;color:inherit;display:block;
  }
  .project-img{
    aspect-ratio:4/3;overflow:hidden;background:var(--travertine);
    display:flex;align-items:center;justify-content:center;
  }
  .project-img img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .6s cubic-bezier(.2,.7,.3,1);
  }
  .project:hover .project-img img,.project:focus-visible .project-img img{transform:scale(1.035);}
  .project-name{
    font-family:var(--titre);font-weight:var(--nom-poids);
    font-size:var(--nom-taille);letter-spacing:var(--nom-espace);text-transform:var(--nom-casse);
    margin:15px 0 0;line-height:1.25;
  }
  .project-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin:6px 0 0;}
  .project:focus-visible{outline:2px solid var(--oxblood);outline-offset:6px;}

  /* INDEX — un sommaire, pas une grille : on lit la liste des chantiers, la vignette n'est
     là que pour situer. Aucune balise en plus, seulement une autre mise en page. */
  html[data-theme="index"] .projects{display:flex;flex-direction:column;gap:0;}
  html[data-theme="index"] .project{
    display:grid;grid-template-columns:58px 1fr;align-items:center;
    column-gap:16px;row-gap:2px;padding:13px 0;border-bottom:1px solid var(--hair);
  }
  html[data-theme="index"] .project:first-child{border-top:1px solid var(--hair);}
  html[data-theme="index"] .project-img{
    grid-row:1 / span 2;aspect-ratio:1/1;width:58px;align-self:center;
  }
  html[data-theme="index"] .project-name{grid-column:2;margin:0;}
  html[data-theme="index"] .project-meta{grid-column:2;margin:0;}
  html[data-theme="index"] .project:hover .project-name{color:var(--stone);}
  /* À partir d'une tablette, la fiche technique se range à droite comme dans un index
     imprimé — sous cette largeur elle passerait à la ligne au milieu d'un mot. */
  @media (min-width:680px){
    html[data-theme="index"] .project{grid-template-columns:64px 1fr auto;}
    html[data-theme="index"] .project-img{grid-row:1;width:64px;}
    html[data-theme="index"] .project-name{grid-column:2;grid-row:1;}
    html[data-theme="index"] .project-meta{grid-column:3;grid-row:1;text-align:right;white-space:nowrap;}
  }
  /* ÉPURE — grille plus dense : on voit plus de chantiers d'un coup. */
  html[data-theme="epure"] .projects{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:clamp(14px,2vw,22px);}
  html[data-theme="epure"] .project-name{margin-top:11px;}

  /* Dans un sommaire, le nom en tête annonce — il n'écrase pas la liste qui suit. Épure et
     Nuit font pareil : c'est le travail qu'on vient voir, pas l'enseigne. */
  html[data-theme="index"] .name,
  html[data-theme="epure"] .name,
  html[data-theme="nuit"] .name{font-size:clamp(17px,3.2vw,23px);letter-spacing:.24em;}
  html[data-theme="index"] header,
  html[data-theme="epure"] header,
  html[data-theme="nuit"] header{padding-top:clamp(26px,5vw,52px);padding-bottom:clamp(20px,3.5vw,32px);}

  .state{padding:70px 0;text-align:center;color:var(--stone);}
  .state h2{font-family:var(--titre);font-weight:500;font-size:25px;color:var(--ink);margin:0 0 10px;}
  .state p{margin:0 auto;max-width:46ch;font-size:14px;}
  .state button{
    margin-top:20px;font-family:var(--texte);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;font-weight:600;color:var(--paper);background:var(--ink);
    border:none;border-radius:999px;padding:11px 22px;cursor:pointer;
  }
  .state button:hover{background:var(--oxblood);}

  /* CHARGEMENT — le manifeste met un instant à arriver, et sur un téléphone en 4G cet
     instant se compte en secondes. Sans rien à l'écran pendant ce temps, la page a l'air
     vide et cassée. Ces cartes grises tiennent la place exacte des vraies, sont dans le
     HTML servi (donc peintes avant même que le script tourne) et disparaissent au premier
     rendu réel. Elles n'annoncent aucun nombre de projets : trois cases neutres. */
  .squelette{cursor:default;pointer-events:none;}
  .squelette .project-img{background:var(--travertine);}
  .sq-l{height:13px;margin-top:17px;background:var(--travertine);}
  .sq-l.court{width:42%;height:10px;margin-top:9px;}
  .squelette .project-img,.squelette .sq-l{animation:respire 1.5s ease-in-out infinite;}
  @keyframes respire{0%,100%{opacity:1;}50%{opacity:.45;}}
  @media (prefers-reduced-motion:reduce){
    .squelette .project-img,.squelette .sq-l{animation:none;}
  }

  /* --- Vue projet --- */
  .detail{display:none;}
  /* Un projet ouvert : la liste, son titre et ses filtres n'ont plus rien à y faire —
     ils appartiennent à l'index. `hidden` seul ne suffit pas pour les filtres, qui sont
     affichés en `flex` dès qu'il y a plusieurs catégories. */
  body.viewing .projects,body.viewing .index-head,body.viewing .filtres{display:none;}
  /* Deux fois le même mot à trois centimètres d'écart : le menu l'annonce, la liste le
     répète. On garde celui qui sert à naviguer. Les autres sections gardent leur titre —
     on y arrive en défilant, il fait repère. */
  body.avec-menu .index-head{display:none;}
  body.viewing .detail{display:block;}
  .back{
    background:none;border:none;padding:0 0 24px;cursor:pointer;font-family:inherit;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);font-weight:600;
  }
  .back:hover{color:var(--oxblood);}
  .detail h2{
    font-family:var(--titre);font-weight:500;
    font-size:clamp(28px,5vw,40px);margin:0;line-height:1.15;
  }
  /* Filtres : n'apparaissent que s'il y a vraiment plusieurs catégories à distinguer.
     Un filtre à un seul bouton n'est pas un filtre, c'est un décor. */
  .filtres{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;}
  .filtres button{
    font-family:var(--texte);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:600;color:var(--stone);
    background:transparent;border:1px solid var(--hair);border-radius:999px;
    padding:8px 15px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;
  }
  .filtres button:hover{color:var(--ink);border-color:var(--stone-light);}
  .filtres button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .detail .project-meta{margin:8px 0 14px;}
  /* Texte de présentation écrit depuis le CRM. Absent, la ligne disparaît entièrement. */
  .detail-text{max-width:62ch;margin:0 0 34px;font-size:15px;line-height:1.75;color:var(--ink);}
  /* Les photos verticales occupaient toute la largeur : sur un écran d'ordinateur, une
     porte-fenêtre en portrait faisait deux mètres de haut et cassait la lecture. Elles se
     mettent maintenant par deux, les horizontales gardent la pleine largeur. C'est la mise
     en page de n'importe quel portfolio de photographe. */
  .shots{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2.5vw,26px);align-items:start;}
  .shot{width:100%;background:var(--travertine);cursor:zoom-in;display:block;border:none;padding:0;
    grid-column:span 2;}
  .shot.portrait{grid-column:span 1;}
  @media (max-width:700px){
    .shots{grid-template-columns:1fr;}
    .shot,.shot.portrait{grid-column:span 1;}
  }
  /* Les images apparaissent en fondu au lieu de « sauter » d'un coup. Le fond de la case
     tient la place avant : rien ne bouge. */
  .shot img{width:100%;height:auto;display:block;opacity:0;transition:opacity .45s ease;}
  .shot img.chargee{opacity:1;}
  /* Légende écrite depuis le CRM. Absente, rien ne s'affiche : une photo sans légende ne
     doit pas laisser un blanc sous elle. */
  .shot-cap{display:block;padding:9px 2px 0;text-align:left;font-size:13px;line-height:1.55;
    color:var(--stone);font-style:italic;}

  /* --- Plein écran --- */
  .lightbox{
    position:fixed;inset:0;z-index:50;background:rgba(30,28,25,.96);
    display:none;align-items:center;justify-content:center;padding:18px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:calc(100% - 54px);object-fit:contain;}
  /* Rang de la photo : sur un téléphone, on ne sait plus où on en est dans une série
     de vingt sans ce repère. */
  .lb-rang{position:absolute;top:22px;left:50%;transform:translateX(-50%);margin:0;
    font-size:11px;letter-spacing:.14em;color:var(--stone-light);}
  .lb-cap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    max-width:min(720px,86vw);margin:0;text-align:center;font-style:italic;
    font-size:13.5px;line-height:1.5;color:var(--paper);}
  .lightbox button{
    position:absolute;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);
    color:var(--paper);width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;
  }
  .lb-close{top:16px;right:16px;}
  .lb-prev{left:14px;top:50%;transform:translateY(-50%);}
  .lb-next{right:14px;top:50%;transform:translateY(-50%);}
  .lightbox button:hover{background:rgba(255,255,255,.2);}

  /* À propos et contact : écrits depuis le CRM. Rien de rempli, rien d'affiché — pas de
     titre orphelin ni de bloc vide en bas de page. */

  /* Un portfolio se parcourt de projet en projet : sans ce lien, il faut remonter tout en

  .projet-contact{

  /* --- À LA VENTE ---------------------------------------------------------------------
     Une grille différente de celle des réalisations, et c'est voulu : un chantier terminé se

  /* Le seul canal de vente aujourd'hui : écrire sur WhatsApp, le nom du produit déjà dans
     le message. Pas de panier, pas de compte — ça n'a pas été demandé. */
  .produit-wa{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;

  /* Hébreu : la page entière se lit de droite à gauche. Les positions écrites en

  [dir="rtl"] .lb-close{right:auto;left:16px;}

  .fondu{opacity:0;transform:translateY(9px);}

    .fondu{opacity:1!important;transform:none!important;}}

<script>
/* Le site ne porte AUCUNE clé d'accès. Il lit un fichier public et des images publiques,

var STORAGE = 'https://njaamykxnvohoesrtpvv.supabase.co/storage/v1/object/public/galerie/';
var OWNER = '797ad2e5-a27a-45c3-a987-d4897d1cadbf';

/* ---- Les trois langues ---------------------------------------------------------------

var MOTS = {
  fr: { realisations:'Réalisations', apropos:'À propos', journal:'Journal',

        panne:'Les réalisations n’ont pas pu être chargées',

        m2:'m²',
        reessayer:'Réessayer', genre:'Un projet de ce genre ? ',

  en: { realisations:'Works', apropos:'About', journal:'Journal',

  he: { realisations:'עבודות', apropos:'אודות', journal:'יומן',
        retour:'→ כל העבודות', suivant:'הפרויקט הבא', tout:'הכול',
        photos:'תמונות', agrandir:'הגדלת התמונה', photo:'תמונה',
        boutique:'למכירה', surDemande:'מחיר לפי בקשה', ecrireWa:'שלחו הודעה בוואטסאפ',
        dispoOui:'במלאי', dispoCommande:'בהזמנה', dispoRupture:'אזל',
        messageWa:'שלום, אני מתעניין/ת ב: ',
        vide:'בקרוב', videTxt:'העבודות הראשונות יפורסמו כאן בקרוב.',
        panne:'לא ניתן היה לטעון את העבודות',
        panneTxt:'החיבור נכשל. בדקו את הרשת ונסו שוב.',
        m2:'מ″ר',
        reessayer:'נסו שוב', genre:'רוצים פרויקט כזה? ',
        ecrire:'כתבו לי', whatsapp:'כתבו לי בוואטסאפ' }
};
/* `dir="auto"` sur tout ce que MELISSA écrit : la page peut être en hébreu (lecture de
   droite à gauche) et le texte, lui, rester français faute de traduction. Sans ce marquage,
   le point final d'une phrase française part se coller au début de la ligne — c'est
   exactement l'état dans lequel le site est livré, tant que les traductions manquent. */
var langue = 'fr';
function mot(k) { return (MOTS[langue] && MOTS[langue][k]) || MOTS.fr[k] || ''; }
/* « 1 photos » sur une carte de portfolio, ça se remarque. */
function nbPhotos(n) { return n + ' ' + mot(n > 1 ? 'photos' : 'photo'); }
/* La surface est saisie librement dans le CRM. Tapée seule — « 110 » — elle s'affichait
   telle quelle au milieu de la fiche technique, entre le lieu et la mission, sans dire de
   quoi il s'agit. On ajoute l'unité UNIQUEMENT quand la valeur est un nombre nu : si
   Mélissa a déjà écrit « 110 m² » ou « 1 200 pi² », on ne touche à rien. L'unité suit la
   langue, comme le reste. */
function surfaceLisible(v) {
  var t = String(v == null ? '' : v).trim();
  if (!t) return '';
  return /^[0-9]+([.,][0-9]+)?$/.test(t.replace(/[\s\u00a0]/g, '')) ? t + ' ' + mot('m2') : t;
}

/* Un texte de Melissa, dans la langue courante — à défaut, le français d'origine.
   `src` permet de le demander sur un objet précis plutôt que sur l'état global : une
   fonction de rendu doit afficher ce qu'on lui passe, sinon elle devient intestable. */
function texteSite(cle, src) {
  var s = src || infosSite || {};
  var tr = (s.i18n || {})[langue] || {};
  return (tr[cle] || '').trim() || (s[cle] || '').trim();
}
function texteEntree(j, cle) {
  var tr = ((j.i18n || {})[langue]) || {};
  return (tr[cle] || '').trim() || (j[cle] || '').trim();
}
function languesDuSite() {
  var l = (infosSite && infosSite.langues) || [];
  var codes = LANGUES.map(function (x) { return x.code; }).filter(function (c) { return l.indexOf(c) >= 0; });
  return codes.length > 1 ? codes : [];

  try { var v = localStorage.getItem('mn-langue'); if (v && MOTS[v]) return v; } catch (e) {}

}

   français d'avant l'arrivée du manifeste écraserait le choix de la visite précédente. */

  langue = MOTS[code] ? code : 'fr';
  if (garder) { try { localStorage.setItem('mn-langue', langue); } catch (e) {} }
  var def = LANGUES.filter(function (l) { return l.code === langue; })[0] || LANGUES[0];
  document.documentElement.lang = langue;
  document.documentElement.dir = def.dir;
}
function renderLangues() {
  var codes = languesDuSite(), host = el('langs');
  host.innerHTML = '';
  if (!codes.length) { host.hidden = true; return; }
  if (codes.indexOf(langue) < 0) poserLangue(codes[0], false);
  host.hidden = false;
  LANGUES.filter(function (l) { return codes.indexOf(l.code) >= 0; }).forEach(function (l) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = l.label;
    b.lang = l.code;
    b.setAttribute('aria-current', l.code === langue ? 'true' : 'false');
    b.addEventListener('click', function () { poserLangue(l.code, true); toutRedessiner(); });
    host.appendChild(b);
  });
}

/* Rejoué à chaque changement de langue : tout ce qui porte du texte doit suivre, y
   compris un projet resté ouvert. */
function toutRedessiner() {
  var s = infosSite || {};
  var sous = texteSite('subtitle');
  if (s.title) { el('site-name').textContent = s.title; el('footer').textContent = s.title + (sous ? ' — ' + sous : ''); }
  if (sous) el('site-tagline').textContent = sous;
  el('t-realisations').textContent = mot('realisations');
  el('t-apropos').textContent = mot('apropos');
  el('t-journal').textContent = mot('journal');
  el('t-suivant').textContent = mot('suivant');
  el('back').textContent = mot('retour');
  renderLangues();
  renderApropos(s);
  renderBoutique();
  renderJournal(s);
  if (projects.length) { renderFiltres(); renderIndex(); }
  /* APRÈS les sections : le menu lit leur état (masquée ou non) pour savoir quelles entrées
     ont un sens. L'appeler avant, c'est construire un menu sur des sections pas encore
     dessinées. */
  renderMenu();
  bdDemarrer();
  if (current) openProject(projects.indexOf(current));
}

/* ---- À la vente ---------------------------------------------------------------------
   Alimentée par `manifest.produits`. Section absente du manifeste = section absente de la
   page : un site sans boutique ne doit pas afficher un rayon vide. */
var produits = [], filtreProd = '';
function texteProduit(p, cle) {
  var tr = ((p.i18n || {})[langue]) || {};
  return (tr[cle] || '').trim() || (p[cle] || '').trim();
}
function renderBoutique() {
  var sec = el('boutique');
  var visibles = produits.filter(function (p) { return p.photos && p.photos.length; });
  sec.hidden = !visibles.length;
  if (!visibles.length) return;
  el('t-boutique').textContent = mot('boutique');
  renderFiltresProd(visibles);
  var host = el('produits');
  host.innerHTML = '';
  var liste = filtreProd ? visibles.filter(function (p) { return (p.categorie || '') === filtreProd; }) : visibles;
  liste.forEach(function (p) { host.appendChild(carteProduit(p)); });
}
function renderFiltresProd(visibles) {
  var host = el('filtres-prod'), cats = [];
  visibles.forEach(function (p) {
    var c = (p.categorie || '').trim();
    if (c && cats.indexOf(c) < 0) cats.push(c);
  });
  if (cats.length < 2) { host.hidden = true; host.innerHTML = ''; filtreProd = ''; return; }
  var ordre = (infosSite && infosSite.categoriesProduits) || [];
  cats.sort(function (a, b) {
    var ia = ordre.indexOf(a), ib = ordre.indexOf(b);
    if (ia < 0 && ib < 0) return a.localeCompare(b, 'fr');
    if (ia < 0) return 1;
    if (ib < 0) return -1;
    return ia - ib;
  });
  host.hidden = false;
  host.innerHTML = '';
  [''].concat(cats).forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dir = 'auto';
    var n = c ? visibles.filter(function (p) { return (p.categorie || '') === c; }).length : visibles.length;
    b.textContent = (c || mot('tout')) + ' (' + n + ')';
    b.setAttribute('aria-pressed', filtreProd === c ? 'true' : 'false');
    b.addEventListener('click', function () { filtreProd = c; renderBoutique(); });
    host.appendChild(b);
  });

/* Le numéro de WhatsApp est celui du contact du site : une seule source, jamais deux
   numéros qui divergent. Sans numéro, aucun bouton — mieux vaut rien qu'un lien mort. */
function lienWhatsApp(p) {
  var tel = ((infosSite || {}).tel || '').trim();
  if (!tel) return '';
  var wa = versWhatsApp(tel);
  if (!wa) return '';
  return 'https://wa.me/' + wa + '?text=' + encodeURIComponent(mot('messageWa') + texteProduit(p, 'nom'));
}
function carteProduit(p) {
  var art = document.createElement('article');
  art.className = 'produit';
  /* Chaque texte porte SA direction, pas la carte : marquer la carte entière faisait lire
     « 180 ₪ / m² » comme « m² / ₪ 180 » dès qu'un nom hébreu ouvrait le bloc, et renvoyait
     le point final des phrases françaises en début de ligne. Un prix mal lu est un prix
     faux. */
  var cover = p.photos.filter(function (x) { return x.cover; })[0] || p.photos[0];
  if (cover) {
    var box = document.createElement('div');
    box.className = 'produit-img';
    var im = document.createElement('img');
    im.loading = 'lazy';
    im.decoding = 'async';
    im.src = url(cover.thumb);
    im.srcset = url(cover.thumb) + ' 700w, ' + url(cover.full) + ' 1600w';
    im.sizes = '(max-width:700px) 100vw, 300px';
    im.alt = texteProduit(p, 'nom');
    box.appendChild(im);
    art.appendChild(box);
  }
  var corps = document.createElement('div');
  corps.className = 'produit-corps';
  var h = document.createElement('h3');
  h.className = 'produit-nom';
  h.dir = 'auto';
  h.textContent = texteProduit(p, 'nom');
  corps.appendChild(h);
  var mat = texteProduit(p, 'matiere');
  if (mat) { var m = document.createElement('p'); m.className = 'produit-matiere'; m.dir = 'auto'; m.textContent = mat; corps.appendChild(m); }
  var prix = document.createElement('p');
  prix.dir = 'auto';
  /* Un prix vide n'est pas un oubli : Melissa ne veut pas forcément afficher ses tarifs. */
  if ((p.prix || '').trim()) { prix.className = 'produit-prix'; prix.textContent = p.prix.trim(); }
  else { prix.className = 'produit-prix demande'; prix.textContent = mot('surDemande'); }
  corps.appendChild(prix);
  var d = document.createElement('p');
  var etat = p.dispo === 'rupture' ? 'Rupture' : (p.dispo === 'commande' ? 'Commande' : 'Oui');
  d.className = 'produit-dispo' + (p.dispo === 'rupture' ? ' rupture' : '');
  d.dir = 'auto';
  d.textContent = mot('dispo' + etat);
  corps.appendChild(d);
  var desc = texteProduit(p, 'description');
  if (desc) { var dp = document.createElement('p'); dp.className = 'produit-desc'; dp.dir = 'auto'; dp.textContent = desc; corps.appendChild(dp); }
  var lien = lienWhatsApp(p);
  if (lien && p.dispo !== 'rupture') {
    var a = document.createElement('a');
    a.className = 'produit-wa';
    a.href = lien;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = mot('ecrireWa');
    corps.appendChild(a);
  }
  art.appendChild(corps);
  guetter(art);
  return art;
}

function renderJournal(site) {
  var entrees = ((site || {}).journal || []).filter(function (j) {
    return texteEntree(j, 'titre') || texteEntree(j, 'texte');

    var tx = texteEntree(j, 'texte');

function url(p) { return STORAGE + p; }

/* Un message plein écran remplace la liste : il doit donc effacer ce qui l'occupait,
   squelettes de chargement compris. Sans ça, un échec de lecture laissait trois cartes
   grises clignoter sous le message d'erreur. */
function showState(title, text, action) {
  el('projects').innerHTML = '';
  el('projects').removeAttribute('aria-busy');
  var s = el('state');
  s.hidden = false;
  s.innerHTML = '<h2></h2><p></p>';
  s.querySelector('h2').textContent = title;
  s.querySelector('p').textContent = text;
  if (action) {
    var b = document.createElement('button');

}

/* Le filtre se construit tout seul à partir de ce qui est publié : aucune liste à tenir
   à jour quelque part, et une catégorie qui disparaît du site disparaît du filtre. */
function renderFiltres() {
  var host = el('filtres');
  var cats = [];
  projects.forEach(function (p) {
    var c = (p.categorie || '').trim();
    if (c && cats.indexOf(c) < 0) cats.push(c);
  });
  /* L'ordre vient du CRM, pas de l'alphabet : « Commercial, Habitation, Bureaux » est un
     ordre voulu. Une catégorie portée par un projet mais absente de la liste reste
     affichée, à la fin — on ne fait jamais disparaître un projet de son rangement. */
  var ordre = (infosSite && infosSite.categories) || [];
  cats.sort(function (a, b) {
    var ia = ordre.indexOf(a), ib = ordre.indexOf(b);
    if (ia < 0 && ib < 0) return a.localeCompare(b, 'fr');
    if (ia < 0) return 1;
    if (ib < 0) return -1;
    return ia - ib;
  });
  if (cats.length < 2) { host.hidden = true; host.innerHTML = ''; filtre = ''; return; }
  host.hidden = false;
  host.innerHTML = '';
  [''].concat(cats).forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    var n = c ? projects.filter(function (p) { return (p.categorie || '').trim() === c; }).length : projects.length;
    b.dir = 'auto';
    b.textContent = (c || mot('tout')) + ' (' + n + ')';
    b.setAttribute('aria-pressed', filtre === c ? 'true' : 'false');
    b.addEventListener('click', function () { filtre = c; renderFiltres(); renderIndex(); });
    host.appendChild(b);
  });
}
function projetsVisibles() {
  if (!filtre) return projects;
  return projects.filter(function (p) { return (p.categorie || '').trim() === filtre; });
}
function renderIndex() {
  var host = el('projects');
  host.innerHTML = '';
  host.removeAttribute('aria-busy');
  el('state').hidden = true;
  projetsVisibles().forEach(function (p, i) {
    var cover = p.photos.filter(function (x) { return x.cover; })[0] || p.photos[0];
    if (!cover) return;
    var b = document.createElement('button');
    b.className = 'project';
    b.type = 'button';
    b.innerHTML = '<div class="project-img"><img alt="" loading="lazy"></div>'
      + '<p class="project-name"></p><p class="project-meta"></p>';
    var vign = b.querySelector('img');
    vign.src = url(cover.thumb);
    vign.decoding = 'async';
    // Les deux premières cartes sont vues tout de suite ; les suivantes attendent d'être
    // approchées. Le format de la case est déjà fixé en CSS (4/3), donc rien ne saute
    // quand une image arrive.
    vign.loading = i > 1 ? 'lazy' : 'eager';
    guetter(b);
    b.querySelector('.project-name').textContent = p.title;
    b.querySelector('.project-name').dir = 'auto';
    b.querySelector('.project-meta').dir = 'auto';
    // Lieu et mission valent mieux qu'un décompte de photos sur une carte de portfolio —
    // mais s'ils manquent, on retombe sur le décompte plutôt que sur une ligne quasi vide.
    var infos = [p.date, p.lieu, p.mission].filter(Boolean);
    if (infos.length < 2) infos.push(nbPhotos(p.photos.length));
    b.querySelector('.project-meta').textContent = infos.join(' · ');
    b.addEventListener('click', function () { openProject(projects.indexOf(p)); });
    host.appendChild(b);
  });
}

/* ---- LE MENU DU SITE ------------------------------------------------------------------
   Une barre collante sous le nom du studio. Deux principes :

   - **Une entrée n'existe que si sa section existe.** Un menu qui propose « À la vente »
     sur un site sans boutique, ou « Journal » sans entrée écrite, envoie le visiteur sur du
     vide. Les sections savent déjà se masquer ; le menu les lit au lieu de les deviner.
   - **Le mot est celui de Melissa, sinon celui de la page.** Un libellé écrit dans le CRM
     l'emporte ; vide, c'est le mot d'appareil, qui lui se traduit tout seul.

   Les CATÉGORIES de réalisations restent en second niveau, sous le titre de la liste :
   elles filtrent une section, elles ne sont pas des sections. Les mêler au menu ferait une
   barre de dix entrées où « Bureau » et « Journal » auraient l'air d'être de même nature. */
var MENU = [
  { cle: 'realisations', mot: 'realisations', champ: 'menuRealisations', cible: 'liste' },
  { cle: 'boutique',     mot: 'boutique',     champ: 'menuBoutique',     cible: 'boutique' },
  { cle: 'journal',      mot: 'journal',      champ: 'menuJournal',      cible: 'journal' },
  { cle: 'apropos',      mot: 'apropos',      champ: 'menuApropos',      cible: 'apropos' },
];
function titreMenu(e) { return texteSite(e.champ) || mot(e.mot); }
/* Ce qui est réellement affiché : les sections se masquent elles-mêmes quand elles sont
   vides, on lit leur état plutôt que de refaire le raisonnement une seconde fois. */
function menuEntrees() {
  return MENU.filter(function (e) {
    if (e.cible === 'liste') return projects.length > 0;
    var sec = el(e.cible);
    return !!sec && !sec.hidden;
  });
}
function renderMenu() {
  var host = el('menu-in'), barre = el('menu');
  var entrees = menuEntrees();
  host.innerHTML = '';
  /* Une seule entrée n'est pas un menu : ce serait un titre déguisé en commande. */
  barre.hidden = entrees.length < 2;
  document.body.classList.toggle('avec-menu', !barre.hidden);
  if (barre.hidden) return;
  entrees.forEach(function (e) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.menu = e.cible;
    b.dir = 'auto';
    b.textContent = titreMenu(e);
    b.addEventListener('click', function () { allerA(e.cible); });
    host.appendChild(b);
  });
  majMenuActif();
}
/* Aller à une section. Un projet ouvert est d'abord refermé : sans ça, on ferait défiler
   la page vers une section cachée sous le détail du projet, et il ne se passerait rien. */
function allerA(cible) {
  /* Il faut savoir si un projet était ouvert AVANT de le refermer : `closeProject` passe
     par l'historique du navigateur, qui est asynchrone — lire `current` après ne dit rien
     de fiable, et on mesurerait la position d'une section pas encore remise en place. */
  var etaitOuvert = !!current;
  if (etaitOuvert) closeProject();
  var faire = function () {
    if (cible === 'liste') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var sec = el(cible);
    if (!sec || sec.hidden) return;
    var h = (el('menu') && !el('menu').hidden) ? el('menu').getBoundingClientRect().height : 0;
    var y = sec.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0) - h - 12;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  };
  /* Refermer un projet redessine la page ET la fait remonter là où on l'avait laissée :
     on attend que tout soit posé, sinon on mesure une section qui n'est pas à sa place. */
  if (etaitOuvert) setTimeout(faire, 140); else requestAnimationFrame(faire);
}
/* Marquer où l'on est. Sans ça, le menu dit ce qu'on PEUT faire mais jamais où l'on est —
   et sur une page qui défile longtemps, on se perd. */
function majMenuActif() {
  var barre = el('menu');
  if (!barre || barre.hidden) return;
  var haut = barre.getBoundingClientRect().height + 24;
  var actif = 'liste';
  menuEntrees().forEach(function (e) {
    if (e.cible === 'liste') return;
    var sec = el(e.cible);
    if (sec && !sec.hidden && sec.getBoundingClientRect().top <= haut) actif = e.cible;
  });
  [].forEach.call(barre.querySelectorAll('button'), function (b) {
    b.setAttribute('aria-current', b.dataset.menu === actif ? 'true' : 'false');
  });
}
var _menuT = null;
window.addEventListener('scroll', function () {
  if (_menuT) return;
  _menuT = requestAnimationFrame(function () { _menuT = null; majMenuActif(); });
}, { passive: true });

/* ---- LE BANDEAU D'ACCUEIL -------------------------------------------------------------
   Une grande image sous le nom du studio, qui fait défiler les projets réalisés. Trois
   règles, et elles viennent de l'usage :

   - **Deux photos qui se suivent.** Deux vues du MÊME projet, prises l'une après l'autre
     dans l'ordre de la galerie : côte à côte, elles se répondent. Deux photos tirées au
     hasard dans deux chantiers différents, non — ça fait catalogue, pas portfolio.
   - **Les projets, eux, passent au hasard.** L'ordre des projets est mélangé à chaque
     tour ; à l'intérieur d'un projet, on avance par paires dans l'ordre. Personne ne voit
     donc deux fois la même chose avant d'avoir tout vu.
   - **Le changement est un fondu, jamais un saut.** La couche cachée est remplie et on
     n'échange les opacités qu'une fois les images RÉELLEMENT chargées : sinon le fondu
     découvrirait une case vide, ce qui est pire que pas de mouvement du tout.

   Sur un téléphone, deux photos côte à côte font deux timbres-poste : on garde les mêmes
   photos et le même ordre, mais une par une. */
var BD_SEC_DEFAUT = 7, BD_SEC_MIN = 3, BD_SEC_MAX = 60;
var bdVues = [], bdRang = 0, bdCouche = -1, bdMinuteur = null;
var bdProjet = null, bdPause = false, bdEchecs = 0, bdLargeur = null, bdParti = false;
var bdParti2 = null, bdGlisse = false, bdX0 = 0;

function bdRegle() {
  var s = infosSite || {};
  var n = parseFloat(s.diaporamaSec);
  if (!isFinite(n) || n < BD_SEC_MIN || n > BD_SEC_MAX) n = BD_SEC_DEFAUT;
  /* Une ou deux photos par vue. Deux, c'est le portfolio : les images se répondent. Une,
     c'est l'affiche : une seule photo, en grand. Le choix appartient à Melissa. */
  var par = parseInt(s.diaporamaPar, 10);
  if (par !== 1 && par !== 2) par = 2;
  return { actif: s.diaporama !== 'aucun', delai: n * 1000, par: par };
}
/* Deux refus à ne pas confondre :
   - `diaporama: 'aucun'` — Melissa ne VEUT PAS de bandeau : il n'existe pas, le site
     commence par la liste des projets ;
   - `animer` faux (réglage « aucun mouvement », ou visiteur qui demande moins d'animation) —
     le bandeau reste, mais figé sur une image. Le faire disparaître serait décider à sa
     place qu'elle ne veut plus l'image parce qu'elle ne veut plus le mouvement. */
function bdDoitDefiler() { return animer && bdVues.length > 1; }
function bdLarge() { return (window.innerWidth || 0) >= 700; }
/* Combien de photos tiennent VRAIMENT dans une vue : le réglage, ramené à ce que l'écran
   permet. Sur un téléphone, deux photos côte à côte font deux timbres-poste — le réglage ne
   peut pas forcer ça. */
function bdParVue() { return bdLarge() ? bdRegle().par : 1; }

function melanger(liste) {
  var t = liste.slice();
  for (var i = t.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), x = t[i];
    t[i] = t[j]; t[j] = x;
  }
  return t;
}
/* La liste des vues : projets mélangés, et dans chacun les photos prises deux par deux
   dans l'ordre. Un projet à trois photos donne donc [1,2] puis [3] — la vue solitaire
   occupe toute la largeur, ce qui casse agréablement le rythme. */
function bdConstruire() {
  var pas = bdParVue();
  var vues = [];
  melanger(projects.filter(function (p) { return (p.photos || []).length; })).forEach(function (p) {
    for (var i = 0; i < p.photos.length; i += pas) vues.push({ p: p, photos: p.photos.slice(i, i + pas) });
  });
  bdVues = vues;
  bdRang = 0;
  bdLargeur = bdLarge();
  bdParti2 = bdParVue();
  bdMajFleches();
}
/* Les flèches n'ont de sens que s'il y a plus d'une vue : sur un site d'un seul projet
   d'une seule photo, deux commandes qui ne font rien valent moins que rien. */
function bdMajFleches() {
  var n = bdVues.length > 1;
  var p = el('bd-prec'), su = el('bd-suiv');
  if (p) p.hidden = !n;
  if (su) su.hidden = !n;
}
/* Remplit une couche et ne rend la main qu'une fois les images arrivées. Une image qui
   échoue ou qui traîne fait abandonner CETTE vue : on passera à la suivante plutôt que de
   croiser vers un trou. */
function bdRemplir(indice, vue) {
  var couche = el('bd-' + indice);
  couche.innerHTML = '';
  couche.className = 'bd-couche' + (vue.photos.length > 1 ? ' duo' : ' solo');
  var attentes = vue.photos.map(function (ph, k) {
    var case_ = document.createElement('span');
    case_.className = 'bd-case';
    var im = document.createElement('img');
    im.decoding = 'async';
    im.alt = ph.caption || (vue.p.title + ' — ' + mot('photo') + ' ' + (k + 1));
    if (ph.w && ph.h) { im.width = ph.w; im.height = ph.h; }
    /* Le bandeau est large : la pleine définition est la bonne source sur un écran
       d'ordinateur, la vignette suffit sur un téléphone. Les deux existent déjà dans le
       stockage, aucune image n'est produite pour l'occasion. */
    im.src = url(ph.full);
    if (ph.thumb) {
      im.srcset = url(ph.thumb) + ' 700w, ' + url(ph.full) + ' 1600w';
      im.sizes = vue.photos.length > 1 ? '(max-width:700px) 100vw, 50vw' : '100vw';
    }
    case_.appendChild(im);
    couche.appendChild(case_);
    return new Promise(function (res, rej) {
      if (im.complete && im.naturalWidth > 0) return res();
      var fini = false;
      var minuteur = setTimeout(function () { if (!fini) { fini = true; rej(new Error('lente')); } }, 8000);
      im.addEventListener('load', function () { if (!fini) { fini = true; clearTimeout(minuteur); res(); } });
      im.addEventListener('error', function () { if (!fini) { fini = true; clearTimeout(minuteur); rej(new Error('absente')); } });
    });
  });
  return Promise.all(attentes);
}
function bdProgrammer() {
  clearTimeout(bdMinuteur);
  if (!bdDoitDefiler() || bdPause) return;
  bdMinuteur = setTimeout(bdAvancer, bdRegle().delai);
}
function bdAvancer() { bdAller(1); }
/* Un seul chemin pour changer de vue, quel que soit ce qui le demande : le minuteur, une
   flèche, une touche du clavier ou un balayage. Deux chemins finiraient par diverger — et
   c'est le genre de divergence qui fait qu'une flèche « saute » une image. */
function bdAller(pas) {
  if (!bdVues.length) return;
  var i = bdRang - 1 + pas;
  /* Le tour est fini : on re-mélange l'ordre des projets. Le hasard se renouvelle sans
     jamais répéter une vue avant d'avoir montré les autres. En arrière, on reboucle sur la
     fin — revenir en arrière depuis la première vue ne doit pas être un cul-de-sac. */
  if (i >= bdVues.length) { bdConstruire(); i = 0; }
  if (i < 0) i = bdVues.length - 1;
  bdRang = i + 1;
  var vue = bdVues[i];
  var cible = bdCouche === 0 ? 1 : 0;
  bdRemplir(cible, vue).then(function () {
    el('bd-0').classList.toggle('on', cible === 0);
    el('bd-1').classList.toggle('on', cible === 1);
    bdCouche = cible;
    bdProjet = vue.p;
    bdEchecs = 0;
    el('bd-nom').textContent = vue.p.title;
    el('bd-meta').textContent = [vue.p.date, vue.p.lieu].filter(Boolean).join(' · ');
    el('bd-legende').hidden = false;
    el('bd-voile').hidden = false;
    el('bandeau').setAttribute('aria-label', vue.p.title);
  }, function () {
    /* Une image absente ne doit pas arrêter le bandeau — ni le faire tourner à vide sur un
       stockage entièrement injoignable. On tente les autres vues, une fois chacune. */
    bdEchecs++;
    if (bdEchecs < bdVues.length) { bdAller(pas); return; }
    if (bdCouche < 0) bdArreter();
  }).then(bdProgrammer, bdProgrammer);
}
function bdArreter() {
  clearTimeout(bdMinuteur);
  el('bandeau').hidden = true;
}
function bdDemarrer() {
  var hote = el('bandeau');
  if (!projects.length || !bdRegle().actif) { bdArreter(); return; }
  hote.hidden = false;
  /* La durée du rapprochement suit le délai réglé : le mouvement doit finir quand la photo
     s'en va, pas rester figé la moitié du temps. */
  hote.style.setProperty('--bd-duree', Math.round(bdRegle().delai / 1000) + 1 + 's');
  if (bdParti) { bdConstruire(); bdMajFleches(); bdProgrammer(); return; }
  bdParti = true;
  bdConstruire();
  bdAvancer();
  /* Suspendre, oui — mais chaque geste doit avoir sa FIN, sinon on ne suspend pas, on
     arrête. C'était le cas d'un `touchstart` sans contrepartie : sur un téléphone, un doigt
     posé une fois sur le bandeau le figeait définitivement, puisque aucun `mouseleave` ne
     vient jamais sur un écran tactile. */
  var suspendre = function () { bdPause = true; clearTimeout(bdMinuteur); };
  var reprendre = function () { bdPause = false; bdProgrammer(); };
  hote.addEventListener('mouseenter', suspendre);
  hote.addEventListener('mouseleave', reprendre);
  hote.addEventListener('focusin', suspendre);
  hote.addEventListener('focusout', reprendre);
  hote.addEventListener('touchstart', suspendre, { passive: true });
  hote.addEventListener('touchend', reprendre, { passive: true });
  hote.addEventListener('touchcancel', reprendre, { passive: true });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearTimeout(bdMinuteur); else bdProgrammer();
  });
  el('bd-ouvrir').addEventListener('click', function () {
    /* Un balayage se termine par un `click` : sans ce garde, glisser pour voir la photo
       suivante ouvrirait le projet au lieu de la montrer. */
    if (bdGlisse) { bdGlisse = false; return; }
    if (!bdProjet) return;
    var i = projects.indexOf(bdProjet);
    if (i >= 0) openProject(i);
  });
  /* ---- Défiler à la main ----
     Trois gestes pour la même chose, parce qu'aucun ne marche partout : les flèches à
     l'écran, les touches ← → quand le bandeau a le focus, et le balayage au doigt.
     Chacun RELANCE le compte à zéro au lieu de couper le défilement : on regarde une image
     de plus, on ne débranche pas le bandeau. */
  var main = function (pas) { clearTimeout(bdMinuteur); bdAller(pas); };
  el('bd-prec').addEventListener('click', function (e) { e.stopPropagation(); main(-1); });
  el('bd-suiv').addEventListener('click', function (e) { e.stopPropagation(); main(1); });
  hote.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); main(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); main(1); }
  });
  hote.addEventListener('touchstart', function (e) {
    bdGlisse = false;
    bdX0 = (e.touches && e.touches[0]) ? e.touches[0].clientX : 0;
  }, { passive: true });
  hote.addEventListener('touchend', function (e) {
    var t = (e.changedTouches && e.changedTouches[0]);
    if (!t || !bdX0) return;
    var d = t.clientX - bdX0;
    /* 45 px : au-dessous, c'est un appui un peu tremblant, pas un balayage. Confondre les
       deux ferait ouvrir un projet quand on voulait passer à l'image suivante. */
    if (Math.abs(d) < 45) return;
    bdGlisse = true;
    main(d < 0 ? 1 : -1);
  }, { passive: true });
  /* Passer du téléphone à l'ordinateur (rotation, fenêtre agrandie) change le nombre de
     photos par vue : on reconstruit, mais seulement quand le seuil est franchi. */
  var attente = null;
  window.addEventListener('resize', function () {
    clearTimeout(attente);
    attente = setTimeout(function () {
      /* On ne reconstruit que si le nombre de photos par vue change vraiment : passer de
         1200 à 1100 px ne doit pas remettre le bandeau au début. */
      if (bdParVue() === bdParti2) return;
      bdConstruire();
      bdProgrammer();
    }, 250);
  });
}

/* Un projet ouvert change l'adresse (ancre) : le titre de l'onglet et la description
   doivent suivre, sinon un lien copié depuis la barre d'adresse arrive avec le titre du
   site entier. Les robots qui lisent le JavaScript (Google) y gagnent aussi. */
var TITRE_SITE = document.title;
var DESC_SITE = (document.querySelector('meta[name="description"]') || {}).content || '';
/* L'image d'aperçu du site, telle qu'écrite dans la page. Refermer un projet doit la
   rendre : sinon un lien copié depuis la liste emporte encore la photo du projet qu'on
   vient de quitter. */
var IMG_SITE = (document.querySelector('meta[property="og:image"]') || {}).content || '';
function majSeo(titre, description, image) {
  document.title = titre;
  var d = document.querySelector('meta[name="description"]');
  if (d) d.content = description;
  var ogt = document.querySelector('meta[property="og:title"]');
  if (ogt) ogt.content = titre;
  var ogd = document.querySelector('meta[property="og:description"]');
  if (ogd) ogd.content = description;
  var ogu = document.querySelector('meta[property="og:url"]');
  if (ogu) ogu.content = location.href;
  var can = document.querySelector('link[rel="canonical"]');
  if (can) can.href = location.href;
  if (image) {
    var ogi = document.querySelector('meta[property="og:image"]');
    if (ogi) ogi.content = image;
  }
}
/* RENDU PUR — `afficherProjet` ne touche jamais à l'adresse ni à l'historique : c'est
   `ouvrirProjet` qui décide de l'entrée d'historique, et `rendreDepuisUrl` qui rejoue un
   état déjà posé (retour navigateur). Deux chemins qui écrivent l'URL finiraient par se
   contredire. */
function afficherProjet(i) {
  current = projects[i];
  el('d-title').textContent = current.title;
  el('d-meta').textContent = [current.date, current.categorie, current.lieu, surfaceLisible(current.surface),
    current.mission, nbPhotos(current.photos.length)].filter(Boolean).join(' · ');
  el('d-text').textContent = current.texte || '';
  el('d-text').hidden = !current.texte;
  var host = el('d-shots');
  host.innerHTML = '';
  current.photos.forEach(function (ph, k) {
    var b = document.createElement('button');
    b.className = 'shot';
    b.type = 'button';
    b.setAttribute('aria-label', mot('agrandir') + ' ' + (k + 1));
    var portrait = !!(ph.w && ph.h && ph.h > ph.w);
    if (portrait) b.className = 'shot portrait';
    var im = document.createElement('img');
    /* Deux tailles existent déjà dans le stockage (1600 px et 700 px) : autant laisser le
       navigateur prendre la plus petite quand elle suffit, plutôt qu'un fichier de 400 Ko
       pour une image affichée sur 350 px. Aucune image supplémentaire n'est produite.
       `srcset` et `sizes` sont posés AVANT `src` : dans l'autre ordre, le navigateur a déjà
       lancé le téléchargement de la grande image quand il découvre qu'une plus petite
       suffisait — et les deux partent. */
    if (ph.thumb) {
      im.srcset = url(ph.thumb) + ' 700w, ' + url(ph.full) + ' 1600w';
      /* `sizes` DIT AU NAVIGATEUR la largeur d'affichage : s'il la surestime, il télécharge
         la grande image alors que la petite suffisait. On annonçait 100vw (390 px sur un
         téléphone) alors que la photo s'affiche sur 346 px — `main` a 22 px de marge de
         chaque côté. Sur un écran à deux pixels physiques par pixel CSS (le cas le plus
         courant), 390 × 2 = 780 dépassait les 700 px de la vignette : le navigateur prenait
         donc la version 1600 px, quatre fois plus lourde, pour l'afficher sur 692 px réels.
         Une fiche de douze photos pesait 4,5 Mo. Avec la vraie largeur, 346 × 2 = 692 tient
         dans la vignette. Rien n'est dégradé : c'est du 1:1. Les écrans à trois pixels
         continuent de recevoir la grande image, comme il se doit. */
      var large = 'calc(100vw - 44px)';
      im.sizes = portrait
        ? '(max-width:700px) ' + large + ', (max-width:1240px) calc((100vw - 70px) / 2), 585px'
        : '(max-width:700px) ' + large + ', (max-width:1240px) ' + large + ', 1196px';
    }
    im.src = url(ph.full);
    im.loading = k < 2 ? 'eager' : 'lazy';
    im.decoding = 'async';
    if (k === 0) im.setAttribute('fetchpriority', 'high');
    if (ph.w && ph.h) { im.width = ph.w; im.height = ph.h; }
    im.alt = ph.caption || (current.title + ' — ' + mot('photo') + ' ' + (k + 1));
    // `complete` couvre le cas d'une image déjà en cache : l'événement `load` serait déjà passé.
    if (im.complete) im.classList.add('chargee');
    else im.addEventListener('load', function () { im.classList.add('chargee'); });
    b.appendChild(im);
    if (ph.caption) {
      var cap = document.createElement('span');
      cap.className = 'shot-cap';
      cap.dir = 'auto';
      cap.textContent = ph.caption;
      b.appendChild(cap);
    }
    b.addEventListener('click', function () { openLightbox(k); });
    host.appendChild(b);
    /* Les deux premières photos d'un projet sont visibles d'emblée : les faire apparaître
       en fondu ferait clignoter l'ouverture. Les suivantes se dévoilent au défilement. */
    if (k > 1) guetter(b);
  });
  document.body.classList.add('viewing');
  /* Le bandeau n'est plus à l'écran : le laisser tourner téléchargerait des photos que
     personne ne regarde. */
  clearTimeout(bdMinuteur);
  window.scrollTo({ top: 0, behavior: 'auto' });
  peindreSuivant();
  peindreContactProjet();
  var couv = current.photos.filter(function (x) { return x.cover; })[0] || current.photos[0];
  majSeo(current.title + ' — ' + TITRE_SITE,
    current.texte || [current.lieu, surfaceLisible(current.surface), current.mission].filter(Boolean).join(' · ') || DESC_SITE,
    couv ? url(couv.full) : '');
}

/* Le projet suivant est le suivant DANS LA LISTE AFFICHÉE : si un filtre est actif, on
   reste dans la même catégorie plutôt que de sauter ailleurs sans prévenir. */
/* Les mêmes coordonnées que la section « À propos », rien de plus : une seule source. */
var infosSite = {};
function peindreContactProjet() {
  var p = el('projet-contact');
  var s = infosSite || {};
  var lien = null;
  if (s.tel) {
    var wa = versWhatsApp(s.tel);
    if (wa) lien = { href: 'https://wa.me/' + wa, texte: mot('whatsapp'), ext: true };
  }
  if (!lien && s.email) lien = { href: 'mailto:' + s.email, texte: mot('ecrire') };
  if (!lien) { p.hidden = true; p.textContent = ''; return; }
  p.hidden = false;
  p.textContent = mot('genre');
  var a = document.createElement('a');
  a.href = lien.href; a.textContent = lien.texte;
  if (lien.ext) { a.target = '_blank'; a.rel = 'noopener'; }
  p.appendChild(a);
  p.appendChild(document.createTextNode('.'));
}
function projetSuivant(d) {
  var liste = projetsVisibles();
  if (liste.length < 2 || !current) return null;
  var i = liste.indexOf(current);
  if (i < 0) return null;
  return liste[(i + (d || 1) + liste.length) % liste.length];
}
function peindreSuivant() {
  var b = el('suivant'), p = projetSuivant(1);
  if (!p) { b.hidden = true; return; }
  b.hidden = false;
  el('suivant-nom').textContent = p.title;
}
el('suivant').addEventListener('click', function () {
  var p = projetSuivant(1);
  if (p) openProject(projects.indexOf(p), 'remplacer');
});

/* Où en était la liste quand on a ouvert un projet. Revenir en haut de page à chaque
   retour oblige à refaire tout le défilement pour retrouver le projet suivant : au
   douzième chantier, plus personne ne remonte. */
var posListe = 0;
function afficherListe() {
  document.body.classList.remove('viewing');
  current = null;
  bdProgrammer();   /* de retour sur l'accueil : le bandeau reprend son défilement */
  majSeo(TITRE_SITE, DESC_SITE, IMG_SITE);
  window.scrollTo({ top: posListe, behavior: 'auto' });
}

/* Qui a ouvert le plein écran : au clavier, il faut lui rendre le focus en refermant,
   sinon on se retrouve renvoyé en haut de page sans savoir où l'on en était. */
var lbRetour = null;
function afficherPhoto(k) {
  if (!current) return;
  if (!el('lightbox').classList.contains('open')) lbRetour = document.activeElement;
  lbIndex = k;
  var ph = current.photos[k];
  el('lb-rang').textContent = (k + 1) + ' / ' + current.photos.length;
  el('lb-img').src = url(ph.full);
  el('lb-img').alt = ph.caption || (current.title + ' — photo ' + (k + 1));
  el('lb-cap').textContent = ph.caption || '';
  el('lb-cap').hidden = !ph.caption;
  el('lightbox').classList.add('open');
  var fermer = el('lb-close');
  if (fermer) fermer.focus();
  /* Les deux voisines sont chargées pendant qu'on regarde celle-ci : le balayage suivant
     est instantané, dans un sens comme dans l'autre. Le préchargement ne se faisait
     qu'après un premier changement de photo — donc jamais pour le tout premier geste,
     celui qu'on fait le plus souvent. */
  precharger(k + 1); precharger(k - 1);
}
function precharger(k) {
  if (!current || !current.photos.length) return;
  var ph = current.photos[(k + current.photos.length) % current.photos.length];
  if (ph) { var pre = new Image(); pre.src = url(ph.full); }
}
function stepLightbox(d) {
  if (!current) return;
  lbIndex = (lbIndex + d + current.photos.length) % current.photos.length;
  openLightbox(lbIndex);
}
function fermerPhoto() {
  if (!el('lightbox').classList.contains('open')) return;
  el('lightbox').classList.remove('open');
  if (lbRetour && document.contains(lbRetour)) lbRetour.focus();
  lbRetour = null;
}

/* ------------------------------------------------------------------------------------
   LE BOUTON « RETOUR » DU NAVIGATEUR

   Ouvrir un projet écrivait une ancre dans l'adresse, mais rien n'écoutait le retour :
   sur un téléphone, le geste ou le bouton « précédent » changeait l'adresse sans rien
   fermer à l'écran. Le visiteur appuyait une deuxième fois — et quittait le site. Le
   plein écran, lui, n'avait aucune entrée d'historique du tout : le geste retour sortait
   carrément du projet.

   Trois vues, trois entrées d'historique : la liste, un projet, une photo en plein écran.
   Une seule règle : ces fonctions-ci écrivent l'historique et laissent le rendu aux
   fonctions `afficher…`, qui n'y touchent jamais. `rendreDepuisUrl` rejoue l'état que le
   navigateur vient de rétablir.

   « Projet suivant » REMPLACE l'entrée au lieu de l'empiler : sinon, après avoir parcouru
   huit chantiers d'affilée, il faudrait appuyer huit fois sur retour pour sortir — et le
   bouton « ← Toutes les réalisations » ne ramènerait qu'au projet précédent.
------------------------------------------------------------------------------------ */
function urlDe(etat) {
  var base = location.pathname + location.search;
  return etat.vue === 'liste' ? base : base + '#p-' + etat.id;
}
function profondeur() {
  var st = history.state;
  return st && typeof st.profondeur === 'number' ? st.profondeur : 0;
}
function pousser(etat) { etat.profondeur = profondeur() + 1; history.pushState(etat, '', urlDe(etat)); }
function remplacer(etat) { etat.profondeur = profondeur(); history.replaceState(etat, '', urlDe(etat)); }
function vueCourante() { return (history.state && history.state.vue) || 'liste'; }

/* Passer d'un projet à un autre REMPLACE toujours l'entrée — bouton « projet suivant »,
   flèches du clavier, peu importe : après huit chantiers enchaînés il faudrait sinon huit
   retours pour ressortir. La règle est ici, pas chez chaque appelant, sans quoi il suffit
   d'oublier un `mode` quelque part pour la casser. `mode` reste utile pour l'arrivée par
   un lien direct, où il n'y a pas encore de projet ouvert et où il ne faut pourtant pas
   empiler par-dessus l'entrée d'arrivée. */
function openProject(i, mode) {
  if (!current) posListe = window.scrollY || window.pageYOffset || 0;
  var etat = { vue: 'projet', id: projects[i].id };
  if (mode === 'remplacer' || current) remplacer(etat); else pousser(etat);
  fermerPhoto();
  afficherProjet(i);
}
function closeProject() {
  /* Une entrée nous précède : on la rejoue, pour que le bouton « précédent » du navigateur
     et celui de la page racontent la même histoire. Arrivé par un lien direct, il n'y a
     rien derrière — on remplace l'entrée plutôt que de faire sortir du site. */
  if (profondeur() > 0) { history.back(); return; }
  remplacer({ vue: 'liste' });
  fermerPhoto();
  afficherListe();
}
function openLightbox(k) {
  if (!current) return;
  var etat = { vue: 'photo', id: current.id, photo: k };
  /* Passer d'une photo à l'autre remplace : trente photos ne doivent pas devenir trente
     entrées d'historique. */
  if (vueCourante() === 'photo') remplacer(etat); else pousser(etat);
  afficherPhoto(k);
}
function closeLightbox() {
  if (vueCourante() === 'photo' && profondeur() > 0) { history.back(); return; }
  if (current) remplacer({ vue: 'projet', id: current.id });
  fermerPhoto();
}
function rendreDepuisUrl() {
  var st = history.state || {};
  var id = st.id || location.hash.replace(/^#p-/, '');
  var idx = -1;
  for (var i = 0; i < projects.length; i++) if (projects[i].id === id) { idx = i; break; }
  if (idx < 0) { fermerPhoto(); afficherListe(); return; }
  if (!current || current.id !== projects[idx].id) afficherProjet(idx);
  if (st.vue === 'photo' && typeof st.photo === 'number') afficherPhoto(st.photo);
  else fermerPhoto();
}
window.addEventListener('popstate', rendreDepuisUrl);

/* Sur un téléphone, on fait défiler les photos au doigt : sans ça il faut viser des
   flèches de 46 px, ce que personne ne fait. Un glissement franc et horizontal seulement,
   pour ne pas confondre avec un défilement de page ou une fermeture. */
(function () {
  var x0 = null, y0 = null, t0 = 0;
  var lb = el('lightbox');
  lb.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Date.now() - t0 > 800) return;              // geste trop lent : ce n'est pas un balayage
    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    stepLightbox(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

el('back').addEventListener('click', closeProject);
el('lb-close').addEventListener('click', closeLightbox);
el('lb-prev').addEventListener('click', function (e) { e.stopPropagation(); stepLightbox(-1); });
el('lb-next').addEventListener('click', function (e) { e.stopPropagation(); stepLightbox(1); });
el('lightbox').addEventListener('click', function (e) { if (e.target === el('lightbox')) closeLightbox(); });
document.addEventListener('keydown', function (e) {
  /* Plein écran ouvert : la tabulation tourne entre ses propres boutons. Sans ça, elle
     descend dans la page qui est derrière, invisible — on tabule dans le vide. */
  if (e.key === 'Tab' && el('lightbox').classList.contains('open')) {
    var focusables = [...el('lightbox').querySelectorAll('button')].filter(function (b) { return b.offsetParent !== null; });
    if (focusables.length) {
      var i = focusables.indexOf(document.activeElement);
      var j = (i + (e.shiftKey ? -1 : 1) + focusables.length) % focusables.length;
      e.preventDefault();
      focusables[j === -1 ? 0 : j].focus();
    }
    return;
  }
  if (!el('lightbox').classList.contains('open')) {
    if (e.key === 'Escape' && current) closeProject();
    /* Projet ouvert : les flèches passent d'un projet à l'autre. Elles ne servent à rien
       d'autre à ce moment-là, et c'est le geste attendu dans un portfolio. */
    if (current && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      var p = projetSuivant(e.key === 'ArrowRight' ? 1 : -1);
      if (p) { e.preventDefault(); openProject(projects.indexOf(p)); }
    }
    return;
  }
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') stepLightbox(-1);
  if (e.key === 'ArrowRight') stepLightbox(1);
});

/* L'ALLURE DU SITE vient du manifeste, choisie depuis le CRM. Un thème inconnu — manifeste
   plus ancien, faute de frappe — laisse la page sur son habillage par défaut plutôt que de
   la vider de ses couleurs. */
var THEMES = { epure: '#ffffff', atelier: '#f4efe6', index: '#f4f4f4', nuit: '#0f0f0f' };
var animer = false;
function appliquerTheme(theme, mouvement) {
  if (theme && THEMES[theme]) {
    document.documentElement.setAttribute('data-theme', theme);
    var mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.content = THEMES[theme];
  }
  /* Le mouvement ne s'active que si TOUT est réuni : le réglage, un observateur pour
     retirer la classe, et un visiteur qui ne demande pas moins d'animation. Sinon on
     n'ajoute rien du tout — une image parquée invisible sans personne pour la révéler est
     une page blanche. */
  animer = mouvement !== 'aucun'
    && typeof IntersectionObserver === 'function'
    && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
var _guetteur = null;
function guetter(el) {
  if (!animer || !el) return;
  if (!_guetteur) {
    _guetteur = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('vu');
        _guetteur.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -8% 0px' });
  }
  el.classList.add('fondu');
  /* Ce qui est déjà à l'écran au chargement ne doit pas attendre un défilement : sur un
     téléphone, la première carte est visible d'emblée. */
  var r = el.getBoundingClientRect();
  if (r.top < (window.innerHeight || 0)) { requestAnimationFrame(function () { el.classList.add('vu'); }); return; }
  _guetteur.observe(el);
}

/* Le numéro tel qu'on l'écrit en Israël (0xx…) vers le format attendu par WhatsApp. */
function versWhatsApp(brut) {
  var d = String(brut || '').replace(/\D/g, '');
  if (!d) return '';
  return d.charAt(0) === '0' ? '972' + d.slice(1) : d;
}
/* L'adresse e-mail n'est jamais écrite dans le HTML servi : elle vient du manifeste et le
   lien est fabriqué ici. Ça décourage les robots ordinaires — ça ne rend pas l'adresse
   secrète pour autant, le manifeste est public. */
function renderApropos(site) {
  var s = site || {};
  var host = el('contact');
  host.innerHTML = '';
  var txt = texteSite('apropos', s);
  el('apropos-txt').textContent = txt;
  el('apropos-txt').hidden = !txt;
  var liens = [];
  if (s.email) liens.push({ href: 'mailto:' + s.email, texte: s.email });
  if (s.tel) {
    var wa = versWhatsApp(s.tel);
    if (wa) liens.push({ href: 'https://wa.me/' + wa, texte: 'WhatsApp · ' + s.tel, ext: true });
    else liens.push({ href: 'tel:' + s.tel, texte: s.tel });
  }
  if (s.instagram) {
    var ig = String(s.instagram).trim();
    var url = /^https?:/i.test(ig) ? ig : 'https://instagram.com/' + ig.replace(/^@/, '');
    liens.push({ href: url, texte: 'Instagram · ' + (ig.charAt(0) === '@' ? ig : '@' + ig.replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/\/$/, '')), ext: true });
  }
  liens.forEach(function (l) {
    var a = document.createElement('a');
    a.href = l.href;
    a.textContent = l.texte;
    if (l.ext) { a.target = '_blank'; a.rel = 'noopener'; }
    host.appendChild(a);
  });
  el('apropos').hidden = !txt && !liens.length;
}

/* La langue du visiteur est posée AVANT la lecture du manifeste : la page ne doit pas
   s'afficher une seconde en français si son choix était l'hébreu. Le sélecteur, lui, attend
   de savoir quelles langues le site propose. */
poserLangue(langueRetenue(), false);

/* Remet les cartes d'attente : au premier chargement elles sont déjà dans le HTML servi,
   mais après un échec et un « Réessayer » il faut les redessiner. */
function squelettes() {
  var host = el('projects');
  host.setAttribute('aria-busy', 'true');
  host.innerHTML = '';
  for (var i = 0; i < 3; i++) {
    var d = document.createElement('div');
    d.className = 'project squelette';
    d.setAttribute('aria-hidden', 'true');
    d.innerHTML = '<div class="project-img"></div><div class="sq-l"></div><div class="sq-l court"></div>';
    host.appendChild(d);
  }
  el('state').hidden = true;
}

/* Une connexion qui ne répond pas n'échoue jamais toute seule : sans limite de temps, le
   visiteur reste sur des cartes grises indéfiniment. Vingt secondes, puis on le dit. */
function lireManifeste() {
  var url_ = url(OWNER + '/manifest.json') + '?t=' + Date.now();
  if (typeof AbortController !== 'function') return fetch(url_, { cache: 'no-store' });
  var ctrl = new AbortController();
  var minuteur = setTimeout(function () { ctrl.abort(); }, 20000);
  return fetch(url_, { cache: 'no-store', signal: ctrl.signal })
    .then(function (r) { clearTimeout(minuteur); return r; },
          function (e) { clearTimeout(minuteur); throw e; });
}

function charger() {
  lireManifeste()
  .then(function (r) { if (!r.ok) throw new Error('manifest ' + r.status); return r.json(); })
  .then(function (m) {
    if (m.site) {
      appliquerTheme(m.site.theme, m.site.mouvement);
      infosSite = m.site;
    }
    projects = (m.realisations || []).filter(function (p) { return p.photos && p.photos.length; });
    produits = m.produits || [];
    /* Un seul point d'entrée du rendu : nom, sous-titre, sélecteur de langue, index,
       filtres, journal et à-propos. C'est aussi ce qu'on rejoue à chaque changement de
       langue — deux chemins de rendu finiraient par diverger. */
    toutRedessiner();
    if (!projects.length) {
      showState(mot('vide'), mot('videTxt'));
      return;
    }
    var h = location.hash.replace('#p-', '');
    if (h && h !== location.hash) {
      for (var i = 0; i < projects.length; i++) if (projects[i].id === h) { openProject(i, 'remplacer'); break; }
    }
  })
  /* Un portfolio vide et une lecture qui échoue se ressemblaient : les deux affichaient
     « Bientôt en ligne ». Le visiteur repartait en croyant qu'il n'y a rien à voir, et
     personne n'apprenait que le site était en panne. Ce sont deux messages distincts, et
     celui de la panne propose de réessayer sur place. */
  .catch(function () {
    toutRedessiner();
    showState(mot('panne'), mot('panneTxt'),
      { texte: mot('reessayer'), faire: function () { squelettes(); charger(); } });
  });
}
charger();
</script>
</body>
</html>
